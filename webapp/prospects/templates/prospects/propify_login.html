<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar a Prospección</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f6fb; color: #172033; }
    .card { width: min(100%, 420px); padding: 32px; background: #fff; border: 1px solid #e3e8f1; border-radius: 18px; box-shadow: 0 18px 50px rgba(27, 45, 78, .12); }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 24px; color: #60708b; line-height: 1.45; }
    label { display: block; margin: 16px 0 7px; font-weight: 650; }
    input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #cbd4e2; border-radius: 10px; font: inherit; }
    input:focus { outline: 3px solid rgba(37, 99, 235, .16); border-color: #2563eb; }
    button { width: 100%; height: 47px; margin-top: 24px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
    .error { margin: 0 0 14px; padding: 11px 13px; border-radius: 9px; background: #fef2f2; color: #b42318; }
    .note { margin-top: 18px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Prospección</h1>
    <p>Ingresa con tu cuenta de Propify.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Usuario</label>
      <input id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Ingresar con Propify</button>
    </form>
    <p class="note">Esta sesión es independiente de Prometeo.</p>
  </main>
</body>
</html>
