<section id="cmp-nearby" class="map-panel cmp-nearby-card" aria-labelledby="cmp-nearby-title" hidden>
  <header id="cmp-nearby-handle" class="cmp-nearby-header">
    <h2 id="cmp-nearby-title">Lugares más cercanos</h2>
    <button id="cmp-nearby-toggle" type="button" aria-controls="cmp-nearby-content" aria-expanded="false" aria-label="Expandir lugares cercanos">+</button>
  </header>
  <div id="cmp-nearby-content" hidden>
    <p id="cmp-nearby-origin">Coloca el pin de tu propiedad.</p>
    <div class="cmp-nearby-controls">
      <label>Buscar dentro de <select id="cmp-nearby-radius"><option value="3000">3 km</option><option value="5000" selected>5 km</option><option value="10000">10 km</option><option value="25000">25 km</option><option value="50000">50 km</option></select></label>
      <label>Más cercano por <select id="cmp-nearby-sort"><option value="WALKING">Recorrido a pie</option><option value="DRIVING">Recorrido en auto</option></select></label>
    </div>
    <div class="cmp-nearby-legend" aria-label="Rangos de cercanía"><span style="--nearby-color:#3b82f6">Azul: hasta 300 m</span><span style="--nearby-color:#e9bd26">Amarillo: más de 300 m a 1 km</span><span style="--nearby-color:#ed6363">Rojo: más de 1 km</span></div>
    <p class="cmp-muted">El color corresponde al recorrido elegido. Los minutos son estimados; en auto consideran el tráfico.</p>
    <p class="cmp-muted">Se comparan hasta 5 lugares próximos por categoría dentro del radio elegido.</p>
    <p id="cmp-nearby-status" role="status" aria-live="polite"></p>
    <div id="cmp-nearby-list"></div>
    <p id="cmp-nearby-route" role="status" hidden></p>
    <div id="cmp-nearby-warnings"></div>
    <small id="cmp-nearby-updated"></small>
    <div class="cmp-nearby-footer"><button id="cmp-nearby-clear-route" type="button">Quitar recorrido</button><button id="cmp-nearby-close" type="button">Cerrar tarjeta</button></div>
  </div>
</section>
