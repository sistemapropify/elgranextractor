<section class="acm-perspective" aria-label="Vista por rol">
<div class="acm-active-role" role="status">Vista activa: <strong>{{ acm_access.role.name }}</strong>{% if acm_access.previewing %}<span class="acm-preview-badge">Vista de prueba</span>{% endif %}</div>
{% if acm_access.can_preview %}<form id="acm-perspective-form" method="post" action="{% url 'acm:perspective' %}">{% csrf_token %}<input type="hidden" name="analysis_view" value="{{ request.GET.analysis_view }}"><label for="acm-perspective-role">Ver ACM como</label><select id="acm-perspective-role" name="role_id">{% for role in acm_roles %}<option value="{{ role.id }}" {% if role.id == acm_access.role.id %}selected{% endif %}>{{ role.name }} · {{ role.area }}</option>{% endfor %}</select><button class="acm-button acm-primary" type="submit">Cambiar rol</button>{% if acm_access.previewing %}<button class="acm-button" type="submit" name="role_id" value="0" onclick="this.form.querySelector('select').disabled=true">Volver a mi rol</button>{% endif %}</form>{% endif %}
</section>
