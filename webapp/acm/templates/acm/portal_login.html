{% load static %}<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar al ACM · Propify</title><link rel="stylesheet" href="{% static 'acm/css/portal.css' %}?v=1"></head><body class="acm-login"><main class="acm-login-panel"><p class="acm-eyebrow">PROPIFY · ACM</p><h1>Ingresa a tu ACM</h1><p>Utiliza tu cuenta de Propify.</p>{% if error %}<p role="alert" class="acm-error">{{ error }}</p>{% endif %}<form id="acm-login-form" method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="username">Usuario</label><input id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="acm-button acm-primary" type="submit">Ingresar con Propify</button></form></main><script src="{% static 'acm/js/portal-login.js' %}?v=1" defer></script></body></html>
