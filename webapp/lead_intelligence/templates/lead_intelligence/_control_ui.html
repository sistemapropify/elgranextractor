<style>
.lc-page{max-width:1360px;margin:28px auto;padding:0 20px;color:#172033}.lc-page h1{font-size:32px;letter-spacing:-.03em;margin:0}.lc-page h2{letter-spacing:-.02em}.lc-page p{line-height:1.6}.lc-nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}.lc-page a{color:#176b61;font-weight:600}.lc-card{padding:22px;margin:16px 0;background:#fff;border:1px solid #e5e9ef;border-radius:16px;box-shadow:0 8px 24px rgba(16,24,40,.06)}.lc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.lc-kpi{margin:0;border-top:3px solid #2d887d}.lc-kpi strong{font-size:32px;display:block;margin-top:7px}.lc-kpi span{font-size:13px;color:#667085;font-weight:700}.lc-muted{font-size:13px;color:#667085}.lc-warning{padding:14px;background:#fff8e7;border:1px solid #f1cf78;border-radius:12px;color:#704d00}.lc-table{overflow:auto}.lc-page table{width:100%;border-collapse:collapse;font-size:14px}.lc-page th{color:#667085;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.lc-page td,.lc-page th{padding:14px 12px;text-align:left;border-bottom:1px solid #edf0f3;vertical-align:top}.lc-page input,.lc-page select,.lc-page textarea{padding:11px;border-radius:9px;background:#fff;color:#172033;border:1px solid #d0d5dd;box-sizing:border-box;max-width:100%}.lc-page label{display:block;margin:10px 0 5px;font-size:13px;font-weight:700;color:#344054}.lc-page button{padding:10px 16px;background:#176b61;border:1px solid #176b61;border-radius:9px;color:#fff;font-weight:700;cursor:pointer}.lc-inline{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.lc-inline form{display:inline}.lc-badge{padding:4px 8px;border:1px solid #d0d5dd;border-radius:999px;font-size:12px}.lc-overdue{color:#b42318;font-weight:700}.lc-page pre,.lc-page blockquote{white-space:pre-wrap;overflow-wrap:anywhere}.lc-page blockquote{padding:12px;margin:12px 0;border-left:3px solid #2d887d;background:#f7fbfa}.lc-page .errorlist{color:#b42318}.lc-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.lc-hero{padding:30px;border:1px solid #315c76;border-radius:16px;background:linear-gradient(120deg,#102d40,#142030);margin:12px 0 24px}.lc-eyebrow{font-size:12px;letter-spacing:.1em;color:#85d6df;margin:0 0 8px}.lc-hero h1{font-size:36px;margin:0 0 12px;line-height:1.2}.lc-actions{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:20px}.lc-primary{background:#6ce0c1;color:#09251e!important;font-weight:700;padding:12px 18px;border-radius:8px;text-decoration:none}.lc-setup{padding:24px;border:1px solid #596244;border-radius:12px;background:#222a22;margin-bottom:22px}.lc-step{display:flex;flex-direction:column;gap:9px;padding:18px;border:1px solid #486258;border-radius:9px;background:#14251e;text-decoration:none}.lc-step strong{font-size:16px;color:#c7f3e5}.lc-step span{font-size:14px;color:#b3c4bd}@media(max-width:600px){.lc-hero{padding:20px}.lc-hero h1{font-size:28px}.lc-actions{align-items:flex-start;flex-direction:column}}
