<style>
.lc-page{max-width:1360px;margin:24px auto;padding:0 18px;color:#d9e4f0}.lc-page h1{font-size:28px}.lc-page p{line-height:1.6}.lc-nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px}.lc-page a{color:#83c4ff}.lc-card{padding:20px;margin:18px 0;background:#142030;border:1px solid #3b4d61;border-radius:12px}.lc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.lc-kpi strong{font-size:30px;display:block}.lc-muted{font-size:13px;color:#abbccd}.lc-warning{padding:14px;background:#352b18;border:1px solid #a68b42;border-radius:8px}.lc-table{overflow:auto}.lc-page table{width:100%;border-collapse:collapse;font-size:14px}.lc-page td,.lc-page th{padding:12px;text-align:left;border-bottom:1px solid #3b4d61;vertical-align:top}.lc-page input,.lc-page select,.lc-page textarea{padding:10px;border-radius:6px;background:#0c1623;color:#e2ebf5;border:1px solid #566b80;box-sizing:border-box;max-width:100%}.lc-page label{display:block;margin:10px 0 5px}.lc-page button{padding:10px 16px;background:#235d4b;border:1px solid #578c7c;border-radius:7px;color:#fff;cursor:pointer}.lc-inline{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.lc-inline form{display:inline}.lc-badge{padding:3px 7px;border:1px solid #66798b;border-radius:10px;font-size:12px}.lc-overdue{color:#ffb2a1}.lc-page pre,.lc-page blockquote{white-space:pre-wrap;overflow-wrap:anywhere}.lc-page blockquote{padding:12px;margin:12px 0;border-left:3px solid #5899bb}.lc-page .errorlist{color:#ffb2a1}.lc-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.lc-hero{padding:30px;border:1px solid #315c76;border-radius:16px;background:linear-gradient(120deg,#102d40,#142030);margin:12px 0 24px}.lc-eyebrow{font-size:12px;letter-spacing:.1em;color:#85d6df;margin:0 0 8px}.lc-hero h1{font-size:36px;margin:0 0 12px;line-height:1.2}.lc-actions{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:20px}.lc-primary{background:#6ce0c1;color:#09251e!important;font-weight:700;padding:12px 18px;border-radius:8px;text-decoration:none}.lc-setup{padding:24px;border:1px solid #596244;border-radius:12px;background:#222a22;margin-bottom:22px}.lc-step{display:flex;flex-direction:column;gap:9px;padding:18px;border:1px solid #486258;border-radius:9px;background:#14251e;text-decoration:none}.lc-step strong{font-size:16px;color:#c7f3e5}.lc-step span{font-size:14px;color:#b3c4bd}@media(max-width:600px){.lc-hero{padding:20px}.lc-hero h1{font-size:28px}.lc-actions{align-items:flex-start;flex-direction:column}}
