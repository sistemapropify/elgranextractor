<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Propifai{% endblock %}</title>
    <style>
        html,
        body {
            min-height: 100%;
            margin: 0;
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            padding: 22px 28px;
        }
        .app-layout {
            display: flex;
            min-height: 100vh;
        }
        .app-sidebar {
            width: 260px;
            flex: 0 0 260px;
            margin: -22px 22px -22px -28px;
            padding: 18px 0;
            border-right: 1px solid #30363d;
            background: #161b22;
        }
        .main-content {
            min-width: 0;
            flex: 1;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 18px 18px;
            border-bottom: 1px solid #30363d;
        }
        .brand-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: #1f6feb;
            color: #fff;
            font-weight: 900;
        }
        .brand-text { color: #f0f6fc; font-weight: 800; }
        .brand-subtext { color: #8b949e; font-size: 10px; }
        .nav-section-title {
            padding: 18px 18px 7px;
            color: #8b949e;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .6px;
            text-transform: uppercase;
        }
        .nav-item { display: block; }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 18px;
            color: #c9d1d9;
            text-decoration: none;
            font-size: 13px;
        }
        .submenu-arrow { margin-left: auto; font-size: 9px; }
        .submenu-items { display: grid; }
        .submenu-item {
            display: flex;
            gap: 8px;
            padding: 7px 18px 7px 42px;
            color: #8b949e;
            text-decoration: none;
            font-size: 12px;
        }
        .submenu-item.active {
            color: #79c0ff;
            background: rgba(31,111,235,.12);
        }
    </style>
    {% block extra_head %}{% endblock %}
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        <nav class="app-sidebar">
            {% block sidebar_brand %}{% endblock %}
            <div class="sidebar-nav">
                {% block sidebar_menu %}{% endblock %}
            </div>
        </nav>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
