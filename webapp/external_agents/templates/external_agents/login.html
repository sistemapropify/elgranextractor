<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agentes externos · Propifai</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --bg: #0d1117;
            --panel: #161b22;
            --raised: #21262d;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --blue: #58a6ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 15%, rgba(31, 111, 235, .16), transparent 32%),
                radial-gradient(circle at 85% 85%, rgba(130, 80, 223, .14), transparent 30%),
                var(--bg);
        }
        .card {
            width: min(100%, 435px);
            padding: 30px;
            background: rgba(22, 27, 34, .96);
            border: 1px solid var(--border);
            border-radius: 17px;
            box-shadow: 0 24px 70px rgba(1, 4, 9, .45);
        }
        .brand {
            display: flex;
            gap: 13px;
            align-items: center;
            margin-bottom: 24px;
        }
        .brand-icon {
            width: 45px;
            height: 45px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #1f6feb, #8250df);
            font-size: 22px;
            font-weight: 800;
        }
        .kicker {
            margin: 0 0 3px;
            color: var(--blue);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.1px;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            color: #f0f6fc;
            font-size: 25px;
            letter-spacing: -.5px;
        }
        .intro {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
        }
        label {
            display: block;
            margin: 15px 0 7px;
            color: #c9d1d9;
            font-size: 12px;
            font-weight: 700;
        }
        input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, .15);
        }
        button {
            width: 100%;
            min-height: 45px;
            margin-top: 23px;
            border: 1px solid #2ea043;
            border-radius: 8px;
            background: #238636;
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 750;
            cursor: pointer;
        }
        button:hover { background: #2ea043; }
        .error {
            margin: 0 0 14px;
            padding: 10px 12px;
            border: 1px solid rgba(248, 81, 73, .45);
            border-radius: 8px;
            background: rgba(248, 81, 73, .1);
            color: #ff9d95;
            font-size: 12px;
            line-height: 1.45;
        }
        .note {
            margin: 17px 0 0;
            color: #6e7681;
            font-size: 11px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <div class="brand-icon" aria-hidden="true">◎</div>
            <div>
                <p class="kicker">Propifai · Red externa</p>
                <h1>Agentes externos</h1>
            </div>
        </div>
        <p class="intro">Ingresa con tus credenciales de Propify para administrar el registro y los documentos de agentes externos.</p>
        {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        <form method="post" novalidate>
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label for="username">Usuario Propify</label>
            <input id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Ingresar con Propify</button>
        </form>
        <p class="note">Módulo independiente del ACM. La sesión se valida directamente contra Propify.</p>
    </main>
</body>
</html>
