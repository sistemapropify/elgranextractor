# Canal PROGRAMADA de evaluación IA de leads (entrantes + contactados).
# Corre a las 09:00 y 21:00 hora de Perú (UTC-5) -> cron en UTC: 0 2,14 * * *.
# Dispara el endpoint protegido del App Service (donde viven las credenciales
# del CRM y DeepSeek) vía POST con X-Analytics-API-Key. La evaluación corre en
# segundo plano dentro de la app; solo re-evalúa leads cuyo history_hash cambió
# (regla de oro, sin gasto DeepSeek innecesario).
name: Evaluar leads - programada (09:00/21:00)

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluar-leads-programada:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar evaluacion programada (entrantes + contactados, 24h)
        run: |
          # -f falla si el endpoint no responde 2xx (no oculta errores). La URL
          # azurewebsites.net evita la proteccion anti-hotlink del dominio
          # acm.propifai.com (exige header Referer y bloquea a GitHub Actions).
          curl -sS -f --max-time 90 -X POST \
            -H "X-Analytics-API-Key: ${{ secrets.ANALYTICS_BRIDGE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Referer: https://acm.propifai.com/" \
            -H "User-Agent: GitHub-Actions" \
            -d '{"stages":"entered","lookback_hours":24,"workers":1}' \
            -w "\nHTTP %{http_code}\n" \
            "https://granextractorservice-emehaffsf8e2c7eg.brazilsouth-01.azurewebsites.net/analisis-crm/api/evaluacion-automatica/"
