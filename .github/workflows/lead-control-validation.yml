name: Validate realtime lead control

on:
  pull_request:
    branches:
      - main
    paths:
      - "webapp/lead_intelligence/**"
      - "webapp/analisis_crm/urls.py"
      - "startup.sh"
      - ".github/workflows/lead-control-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused control dependencies
        run: |
          python -m pip install \
            "Django==5.0.6" \
            "django-environ>=0.11,<0.13" \
            "djangorestframework==3.16.1" \
            "google-auth>=2,<3" \
            "Pillow>=10,<13" \
            "requests>=2.32,<3"

      - name: Test realtime refresh endpoint
        working-directory: webapp
        run: |
          python manage.py test \
            lead_intelligence.test_control_refresh_api \
            --settings=lead_intelligence.control_test_settings \
            --noinput --verbosity 1
