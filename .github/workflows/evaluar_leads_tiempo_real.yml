# Canal TIEMPO REAL de evaluación IA de leads (bidireccional, calificados,
# intención de visita, en visita). Barrido cada 15 minutos.
# Dispara el endpoint protegido del App Service vía POST con
# X-Analytics-API-Key. La evaluación corre en segundo plano dentro de la app;
# solo re-evalúa los leads de la ventana (6h) cuyo history_hash cambió; los
# sin cambios se omiten (regla de oro, sin gasto DeepSeek).
name: Evaluar leads - tiempo real (cada 15 min)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluar-leads-tiempo-real:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar evaluacion tiempo real (bidireccional, 6h)
        run: |
          curl -sS --max-time 90 -X POST \
            -H "X-Analytics-API-Key: ${{ secrets.ANALYTICS_BRIDGE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"stages":"bidirectional","lookback_hours":6,"workers":2}' \
            "https://acm.propifai.com/analisis-crm/api/evaluacion-automatica/"
