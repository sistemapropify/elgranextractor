# v2 — Trigger deploy en Azure Web App - granextractorservice
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - granextractorservice

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize production releases so App Service receives one deployment at a time.
concurrency:
  group: granextractorservice-production
  cancel-in-progress: false

jobs:
  cad-reader:
    # glibc 2.35 also runs on the App Service Debian/glibc 2.36 image.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned GNU LibreDWG reader
        run: bash scripts/build_cad_reader.sh cad-runtime
      - name: Verify actual DWG conversion
        run: |
          for version in 2000 2018; do
            curl --fail --location --retry 2 --max-time 30 \
              "https://raw.githubusercontent.com/LibreDWG/libredwg/0.14/test/test-data/$version/Polygon.dwg" \
              -o "/tmp/polygon-$version.dwg"
            cad-runtime/bin/dwg2dxf -v0 -o "/tmp/polygon-$version.dxf" "/tmp/polygon-$version.dwg"
            grep -q LWPOLYLINE "/tmp/polygon-$version.dxf"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: cad-reader
          path: cad-runtime/
          retention-days: 1

  build:
    needs: cad-reader
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cad-reader
          path: cad-runtime/

      - name: Restore native reader permissions
        run: chmod +x cad-runtime/bin/dwg2dxf

      - name: Set up Python version
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Validate complete district loading
        run: |
          node webapp/cuadrantizacion/test_geollaqta_district.cjs
          node webapp/cuadrantizacion/test_geollaqta_loading.cjs
          node webapp/cuadrantizacion/test_geollaqta_data.cjs
          node webapp/cuadrantizacion/test_geollaqta_gallery.cjs
          node webapp/cuadrantizacion/test_geollaqta_measures.cjs
          node webapp/cuadrantizacion/test_geollaqta_labels.cjs
          node webapp/acm/test_cadastral.cjs

      - name: Validate ACM references and facade
        run: |
          node webapp/acm/static/acm/js/components-presentation.test.cjs
          node webapp/acm/test_valuation_controls.cjs
          node webapp/acm/test_street_facade.cjs
          source antenv/bin/activate
          python webapp/manage.py test acm.test_reference_fallback --settings=acm.access_test_settings --noinput

      - name: Validate direct cadastral report queries
        run: |
          source antenv/bin/activate
          python webapp/manage.py test catastro.test_map_report catastro.test_collector acm.test_cadastral cuadrantizacion.test_geollaqta --settings=acm.access_test_settings --noinput

      - name: Validate reports, facade, concurrent collector and portal areas
        run: |
          source antenv/bin/activate
          python webapp/manage.py test acm.test_client_report acm.test_report_selection acm.test_weighted_adjustments acm.test_reference_fallback acm.test_valuation_notes acm.test_cadastral_facade_template --settings=acm.access_test_settings --noinput
          python webapp/manage.py test catastro.test_parallel catastro.test_collector catastro.test_external_worker catastro.test_views --settings=catastro.test_settings --noinput
          python webapp/manage.py test ingestas.tests.test_scraping_local_worker ingestas.tests.test_scraping_dashboard_state ingestas.tests.test_apartment_floor ingestas.tests.test_scraping_export ingestas.tests.test_scraping_integrity scrapi.test_properati_areas scrapi.test_properati_age scrapi.test_properati_location --settings=ingestas.scraping_test_settings --noinput
          node webapp/catastro/test_parallel_dashboard.cjs
          node webapp/ingestas/tests/test_scraping_executor.cjs
          node webapp/cuadrantizacion/test_geollaqta_facade.cjs

      - name: Collect Django static files
        env:
          # Valores dummy para que Django cargue settings sin conexión a BD.
          # collectstatic solo necesita que Django se inicie, no que consulte la BD.
          DB_NAME: 'dummy'
          DB_USER: 'dummy'
          DB_PASSWORD: 'dummy'
          DB_HOST: 'dummy'
          DB_PORT: '1433'
          SECRET_KEY: 'dummy-secret-key-for-build'
          PRODUCTION: 'true'
        run: |
          source antenv/bin/activate
          python webapp/manage.py collectstatic --noinput

      - name: Validate Azure production startup
        env:
          DB_NAME: 'dummy'
          DB_USER: 'dummy'
          DB_PASSWORD: 'dummy'
          DB_HOST: 'dummy'
          DB_PORT: '1433'
          SECRET_KEY: 'dummy-secret-key-for-build'
          PRODUCTION: 'true'
          WEBSITE_SITE_NAME: 'granextractorservice'
        run: |
          source antenv/bin/activate
          python -c "import os, sys; sys.path.insert(0, 'webapp'); os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'settings'); from wsgi import application; print('Azure WSGI startup validated')"

      - name: Validate deployment startup script
        run: |
          bash -n startup.sh
          test -f webapp/manage.py
          grep -Fq 'Camoufox deferred to scraper execution' startup.sh
          grep -Fq 'propifai-camoufox-deps.installing' startup.sh
          grep -Fq 'libgtk-3-0' startup.sh
          grep -Fq 'timeout 90 python manage.py migrate' startup.sh
          grep -Fq 'python manage.py migrate prospects --noinput' startup.sh
          grep -Fq 'python manage.py scraping_watchdog' startup.sh
          grep -Fq 'SCRAPING_EXECUTION_MODE' startup.sh
          grep -Fq 'exec gunicorn' startup.sh
          ! grep -Fq 'prepare_camoufox' startup.sh

      # Build the deployment artifact without generated browser profiles,
      # duplicated projects, logs, or other runtime-only data.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v7
        with:
          name: python-app
          path: |
            .
            !antenv/
            !elgranextractor/**
            !webapp/camoufox_session/**
            !webapp/camoufox_session_adondevivir/**
            !webapp/logs/**
            !webapp/__pycache__/**
            !webapp/**/*.pyc
            !webapp/*.xlsx
            !webapp/*.log
            !webapp/*.har
          if-no-files-found: error
          retention-days: 1

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService


  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BD7ACFF66075413F896FF528B42CABC0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0FA92F15F0804AE197DC2EECF943B7DB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C521A0DD71BB48CE88443464F4F718FB }}

      - name: Brief pause before deploying
        run: |
          # Este app service no tiene deployment slots (solo el sitio por
          # defecto), asi que no hay nada real que "esperar a que se libere":
          # el loop de az webapp deployment slot list anterior siempre
          # devolvia "unknown" (ademas apuntaba a un resource group que no
          # existe: DefaultResourceGroup-brazilsouth). Los conflictos 409
          # reales ya se manejan con los 3 intentos + backoff de abajo.
          echo "Esperando 30s antes de desplegar..."
          sleep 30

      - name: 'Deploy to Azure Web App (Attempt 1)'
        uses: azure/webapps-deploy@v3
        id: deploy-attempt-1
        with:
          app-name: 'granextractorservice'
          slot-name: 'Production'
        continue-on-error: true

      - name: Wait before retry
        if: steps.deploy-attempt-1.outcome == 'failure'
        run: |
          echo "Deployment attempt 1 failed, waiting 90 seconds before retry..."
          sleep 90

      - name: 'Deploy to Azure Web App (Attempt 2)'
        if: steps.deploy-attempt-1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        id: deploy-attempt-2
        with:
          app-name: 'granextractorservice'
          slot-name: 'Production'
        continue-on-error: true

      - name: Wait before final retry
        if: steps.deploy-attempt-2.outcome == 'failure'
        run: |
          echo "Deployment attempt 2 failed, waiting 120 seconds before final retry..."
          sleep 120

      - name: 'Deploy to Azure Web App (Attempt 3 - Final)'
        if: steps.deploy-attempt-2.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        id: deploy-attempt-3
        with:
          app-name: 'granextractorservice'
          slot-name: 'Production'

      # El zip deploy puede tardar mas que la ventana de cinco minutos de la
      # asercion OIDC inicial. Solicitar una credencial nueva antes de usar az.
      - name: Refresh Azure login after deployment
        if: success()
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BD7ACFF66075413F896FF528B42CABC0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0FA92F15F0804AE197DC2EECF943B7DB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C521A0DD71BB48CE88443464F4F718FB }}
      - name: Configure and verify the Azure startup command
        if: success()
        run: |
          az webapp config set \
            --resource-group rg-elgranextractor \
            --name granextractorservice \
            --startup-file "bash startup.sh" \
            --always-on true \
            --output none
          STARTUP_COMMAND=$(az webapp config show \
            --resource-group rg-elgranextractor \
            --name granextractorservice \
            --query appCommandLine -o tsv)
          test "$STARTUP_COMMAND" = "bash startup.sh"

      - name: Verify deployment
        if: success()
        run: |
          echo "Deployment completed successfully"
          echo "App URL: https://granextractorservice-emehaffsf8e2c7eg.brazilsouth-01.azurewebsites.net"
          http_status() {
            local output_file="$1"
            local url="$2"
            local status
            status=$(curl -sS -o "$output_file" -w "%{http_code}" \
              --connect-timeout 5 --max-time 10 "$url" 2>/dev/null) || true
            echo "${status:-000}"
          }

          for i in {1..45}; do
            HEALTH_STATUS=$(http_status /tmp/health-response.json \
              https://granextractorservice-emehaffsf8e2c7eg.brazilsouth-01.azurewebsites.net/api/v1/intelligence/health/)
            CSS_STATUS="pending"
            JS_STATUS="pending"
            LOGO_STATUS="pending"
            MOBILE_SCHEMA_STATUS="pending"
            if [ "$HEALTH_STATUS" = "200" ]; then
              CSS_STATUS=$(http_status /tmp/chat-workspace.css \
                https://granextractorservice-emehaffsf8e2c7eg.brazilsouth-01.azurewebsites.net/static/intelligence/chat-workspace.css)
              JS_STATUS=$(http_status /tmp/chat.js \
                https://granextractorservice-emehaffsf8e2c7eg.brazilsouth-01.azurewebsites.net/static/intelligence/chat.js)
              LOGO_STATUS=$(http_status /tmp/logo-propify.png \
                https://granextractorservice-emehaffsf8e2c7eg.brazilsouth-01.azurewebsites.net/static/intelligence/img/logo-propify.png)
              MOBILE_SCHEMA_STATUS=$(http_status /tmp/mobile-schema.json \
                https://granextractorservice-emehaffsf8e2c7eg.brazilsouth-01.azurewebsites.net/prospects/api/mobile/schema-health/)
            fi
            echo "Check $i/45 - health=$HEALTH_STATUS css=$CSS_STATUS js=$JS_STATUS logo=$LOGO_STATUS mobile_schema=$MOBILE_SCHEMA_STATUS"
            if [ "$HEALTH_STATUS" = "200" ] \
              && [ "$CSS_STATUS" = "200" ] \
              && [ "$JS_STATUS" = "200" ] \
              && [ "$LOGO_STATUS" = "200" ] \
              && [ "$MOBILE_SCHEMA_STATUS" = "200" ] \
              && grep -q '"status":"ok"\|"status": "ok"' /tmp/mobile-schema.json \
              && grep -q '"status":"ok"\|"status": "ok"' /tmp/health-response.json; then
              ACM_STATUS=$(http_status /tmp/acm-login.html https://acm.propifai.com/acm/login/)
              VIEWER_STATUS=$(http_status /tmp/cad-viewer.html https://acm.propifai.com/catastro/visor-planos/)
              ACM_JS_STATUS=$(http_status /tmp/acm-components.js https://acm.propifai.com/static/acm/js/components.js)
              CAD_JS_STATUS=$(http_status /tmp/visor-planos.js https://acm.propifai.com/static/js/visor-planos.js)
              CAD_CSS_STATUS=$(http_status /tmp/visor-planos.css https://acm.propifai.com/static/css/visor-planos.css)
              MASTER_STATUS=$(http_status /tmp/master-denied.json https://acm.propifai.com/acm/catastro/configuracion/)
              QUAD_STATUS=$(http_status /tmp/quad-protected.html https://acm.propifai.com/cuadrantizacion/mapa/)
              EXTRA_STATIC_OK=1
              while IFS='|' read -r asset source; do
                ASSET_STATUS=$(http_status /tmp/cadastral-asset "https://acm.propifai.com/static/$asset")
                if [ "$ASSET_STATUS" != "200" ] || ! cmp -s /tmp/cadastral-asset "$source"; then
                  echo "Release asset pending: $asset ($ASSET_STATUS)"
                  EXTRA_STATIC_OK=0
                  break
                fi
              done <<'CATASTRO_ASSETS'
          acm/js/street-facade.js|webapp/acm/static/acm/js/street-facade.js
          js/street-facade-view.js|webapp/static/js/street-facade-view.js
          js/catastro-dashboard.js|webapp/static/js/catastro-dashboard.js
          css/geollaqta-map.css|webapp/static/css/geollaqta-map.css
          acm/js/components-presentation.js|webapp/acm/static/acm/js/components-presentation.js
          acm/js/comparison-valuation.js|webapp/acm/static/acm/js/comparison-valuation.js
          acm/js/cadastral-info.js|webapp/acm/static/acm/js/cadastral-info.js
          acm/css/cadastral-info.css|webapp/acm/static/acm/css/cadastral-info.css
          js/catastro-master-data.js|webapp/static/js/catastro-master-data.js
          js/geollaqta-data.js|webapp/static/js/geollaqta-data.js
          js/geollaqta-district.js|webapp/static/js/geollaqta-district.js
          js/geollaqta-labels.js|webapp/static/js/geollaqta-labels.js
          js/geollaqta-google.js|webapp/static/js/geollaqta-google.js
          js/geollaqta-map.js|webapp/static/js/geollaqta-map.js
          js/cuadrantizacion-street-view.js|webapp/static/js/cuadrantizacion-street-view.js
          css/cuadrantizacion-street-view.css|webapp/static/css/cuadrantizacion-street-view.css
          CATASTRO_ASSETS
              if [ "$ACM_STATUS" = "200" ] && [ "$VIEWER_STATUS" = "302" ] \
                && [ "$ACM_JS_STATUS" = "200" ] && [ "$CAD_JS_STATUS" = "200" ] && [ "$CAD_CSS_STATUS" = "200" ] \
                && [ "$MASTER_STATUS" = "401" ] && [ "$QUAD_STATUS" = "302" ] && [ "$EXTRA_STATIC_OK" = "1" ] \
                && grep -q Propify /tmp/acm-login.html \
                && cmp -s /tmp/acm-components.js webapp/acm/static/acm/js/components.js \
                && cmp -s /tmp/visor-planos.js webapp/static/js/visor-planos.js \
                && cmp -s /tmp/visor-planos.css webapp/static/css/visor-planos.css; then
                echo "Application, ACM login, protected DWG viewer and release static assets verified"
                exit 0
              fi
              echo "Waiting for the ACM/viewer release: login=$ACM_STATUS viewer=$VIEWER_STATUS"
            fi
            sleep 15
          done
          echo "Application or static assets did not become healthy after the 15-minute stabilization window"
          exit 1

      # El health-check puede durar varios minutos. Renovar OIDC otra vez para
      # que la obtencion de logs no falle con AADSTS700024.
      - name: Refresh Azure login for diagnostics
        if: failure()
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BD7ACFF66075413F896FF528B42CABC0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0FA92F15F0804AE197DC2EECF943B7DB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C521A0DD71BB48CE88443464F4F718FB }}

      - name: Capture App Service logs after failed verification
        if: failure()
        run: |
          echo "=== Last App Service log entries ==="
          timeout 90 az webapp log tail \
            --name granextractorservice \
            --resource-group rg-elgranextractor || true
      - name: Logout from Azure
        if: always()
        run: |
          az logout || true
